# [INPUT]: 官方源码 commit、npm 双锁和目标 OS/架构原生构建机。
# [OUTPUT]: 官方 Electron 三平台实验安装包与实际应用验收记录。
# [POS]: codex/official-desktop 分支构建；不覆盖 main 的 Pake Release。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Build official desktop
on:
  push:
    branches: [codex/official-desktop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            arch: x64
          - name: macos-arm64
            os: macos-15
            arch: arm64
          - name: windows-x64
            os: windows-2022
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix runtime --ignore-scripts
          node node_modules/electron/install.js
      - uses: actions/cache@v4
        with:
          path: .build/primary-downloads
          key: primary-runtime-${{ matrix.name }}-${{ hashFiles('upstream.json') }}
      - name: Build official desktop
        run: npm run build
      - name: Verify distribution changes
        run: npm test
      - name: Verify macOS packaged application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$(find dist/electron -maxdepth 2 -name 'OwnDsh Electron.app' -type d)"
          codesign --verify --deep --strict "$app"
          OWNDSH_TEST_APP="$PWD/$app/Contents/MacOS/OwnDsh Electron" npm run test:app
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/electron/*.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'OwnDsh Electron test'
          $setup = Start-Process $installer -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          $env:OWNDSH_TEST_APP = Join-Path $installDir 'OwnDsh Electron.exe'
          npm run test:app
      - uses: actions/upload-artifact@v4
        with:
          name: OwnDsh-Electron-${{ matrix.name }}
          path: |
            dist/electron/*.dmg
            dist/electron/*.exe
            dist/electron/build-info-*.json
            dist/electron/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
