# [INPUT]: upstream.json 固定的官方源码、patches/ 接缝与官方 Electron 构建流水线
# [OUTPUT]: Windows x64、macOS ARM64/x64 unsigned 安装包、feed 元数据和 blockmap；push/PR/手动触发均可，v* 标签自动发布 Release
# [POS]: 桌面发行的唯一 CI 入口；普通构建产出 Artifacts，v* 标签构建自动发布 Release；不签名
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Build desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            target: win-x64
          - name: mac-arm64
            os: macos-15
            target: mac-arm64
          - name: mac-x64
            os: macos-15-intel
            target: mac-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache official git objects
        uses: actions/cache@v4
        with:
          # 只缓存 bare 仓库（git 对象）；worktree 每次从对象重建，避免残留构建状态。
          path: .build/official-harness.git
          key: official-harness-${{ hashFiles('upstream.json') }}

      - name: Verify patch seams
        run: npm test

      - name: Set tagged build version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "DSH_DESKTOP_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          DSH_DESKTOP_TARGET: ${{ matrix.target }}
          DSH_DESKTOP_UNSIGNED: ${{ matrix.target == 'win-x64' && '1' || '0' }}
          DSH_DESKTOP_MAC_UNSIGNED: ${{ startsWith(matrix.target, 'mac-') && '1' || '0' }}
        run: npm run build

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = '.build/official-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-ChildItem -Path $root -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe','.zip','.blockmap','.yml' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination artifacts -Force
              Write-Output "collected: $($_.Name)"
            }
          Copy-Item .build/build-info-official.json artifacts -ErrorAction SilentlyContinue

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=".build/official-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          mkdir -p artifacts
          find "$root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp -v {} artifacts/ \;
          cp .build/build-info-official.json artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: owndsh-desktop-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: owndsh-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \) -print)
          test "${#assets[@]}" -gt 0
          test -n "$(find release-assets -name 'nightly.yml' -print -quit)"
          test -n "$(find release-assets -name 'nightly-mac.yml' -print -quit)"
          test -n "$(find release-assets -name '*.exe' -print -quit)"
          test -n "$(find release-assets -name '*.dmg' -print -quit)"
          test -n "$(find release-assets -name '*.blockmap' -print -quit)"
          printf '%s\n' "${assets[@]}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \) -print)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "OwnDsh Desktop $RELEASE_TAG" \
              --generate-notes
          fi
