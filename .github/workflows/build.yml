# [INPUT]: upstream.json 固定的官方源码、patches/ 接缝、官方 Electron 流水线与 build/prepare-release.mjs
# [OUTPUT]: Windows x64、macOS ARM64/x64 unsigned 安装包、feed 元数据和 blockmap；PR/手动触发可验证，v* 标签自动发布 Release
# [POS]: 桌面发行的唯一 CI 入口；v* 标签自动发布，PR/手动构建只上传 Artifacts；macOS 使用 ad-hoc 签名
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Build desktop

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            target: win-x64
          - name: mac-arm64
            os: macos-15
            target: mac-arm64
          - name: mac-x64
            os: macos-15-intel
            target: mac-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache official git objects
        uses: actions/cache@v4
        with:
          # 只缓存 bare 仓库（git 对象）；worktree 每次从对象重建，避免残留构建状态。
          path: .build/official-harness.git
          key: official-harness-${{ hashFiles('upstream.json') }}

      - name: Verify patch seams
        run: npm test

      - name: Set tagged build version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "DSH_DESKTOP_BUILD_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        env:
          DSH_DESKTOP_TARGET: ${{ matrix.target }}
          DSH_DESKTOP_UNSIGNED: '1'
        run: npm run build

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = '.build/official-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-ChildItem -Path $root -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe','.zip','.blockmap','.yml' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination artifacts -Force
              Write-Output "collected: $($_.Name)"
            }
          Copy-Item .build/build-info-official.json artifacts -ErrorAction SilentlyContinue

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=".build/official-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          app="$(find "$root" -maxdepth 3 -type d -name 'OwnDsh Desktop.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement="$(codesign -d --requirements - "$app" 2>&1 | sed -n '/^designated/,$p')"
          test "$requirement" = 'designated => identifier "com.owndsh.desktop"'
          zip="$(find "$root" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip"
          extracted="$(mktemp -d)"
          ditto -x -k "$zip" "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted/OwnDsh Desktop.app"
          zip_requirement="$(codesign -d --requirements - "$extracted/OwnDsh Desktop.app" 2>&1 | sed -n '/^designated/,$p')"
          test "$zip_requirement" = 'designated => identifier "com.owndsh.desktop"'
          rm -rf "$extracted"
          mkdir -p artifacts
          find "$root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp -v {} artifacts/ \;
          cp .build/build-info-official.json artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: owndsh-desktop-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: owndsh-desktop-*
          path: release-artifacts
          merge-multiple: false

      - name: Prepare release assets and macOS feed
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node build/prepare-release.mjs release-artifacts release-assets "$RELEASE_TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \) -print)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OwnDsh Desktop $RELEASE_TAG" \
              --generate-notes
          fi
