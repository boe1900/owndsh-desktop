# [INPUT]: upstream.json 固定的官方源码、patches/ 接缝与官方 Electron 构建流水线
# [OUTPUT]: Windows x64、macOS ARM64/x64 unsigned 安装包与构建元数据；push/PR/手动触发均可
# [POS]: 桌面发行的唯一 CI 入口；不签名，产物作为 Artifacts 提供
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            target: win-x64
          - name: mac-arm64
            os: macos-15
            target: mac-arm64
          - name: mac-x64
            os: macos-15-intel
            target: mac-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache official git objects
        uses: actions/cache@v4
        with:
          # 只缓存 bare 仓库（git 对象）；worktree 每次从对象重建，避免残留构建状态。
          path: .build/official-harness.git
          key: official-harness-${{ hashFiles('upstream.json') }}

      - name: Verify patch seams
        run: npm test

      - name: Build
        env:
          DSH_DESKTOP_TARGET: ${{ matrix.target }}
          DSH_DESKTOP_UNSIGNED: ${{ matrix.target == 'win-x64' && '1' || '0' }}
          DSH_DESKTOP_MAC_UNSIGNED: ${{ startsWith(matrix.target, 'mac-') && '1' || '0' }}
        run: npm run build

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = '.build/official-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Get-ChildItem -Path $root -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe','.zip','.blockmap','.yml' } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination artifacts -Force
              Write-Output "collected: $($_.Name)"
            }
          Copy-Item .build/build-info-official.json artifacts -ErrorAction SilentlyContinue

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          root=".build/official-harness/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts"
          mkdir -p artifacts
          find "$root" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) -exec cp -v {} artifacts/ \;
          cp .build/build-info-official.json artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: owndsh-desktop-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
